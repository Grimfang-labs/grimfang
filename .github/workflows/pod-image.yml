# Builds the test-pod image and publishes it to GitHub Container Registry.
#
# Runs in CI so you never need Docker installed on the Windows desktop.
# The published image is public, which matters because pod marketplaces
# generally cannot authenticate to a private registry.
#
# Image: ghcr.io/grimfang-labs/grimfang-pod:latest

name: pod-image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/pod-image.yml'
  workflow_dispatch:        # manual rebuild button in the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/grimfang-pod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
